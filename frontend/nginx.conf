# Limitación de ritmo por IP para /api/. limit_req_zone solo es válida en contexto http: este fichero
# va a conf.d/ y el nginx.conf de la imagen lo incluye dentro de http { }, así que va fuera de server.
# 10 MB de estado guardan unas 160 000 IP (64 bytes por IP con $binary_remote_addr).
#
# La clave es la IP del cliente TCP. Detrás de un balanceador o CDN todas serían la del balanceador:
# habría que activar el módulo realip (set_real_ip_from <rango del balanceador>; real_ip_header
# X-Forwarded-For; real_ip_recursive on;) para que $binary_remote_addr sea la IP real.
# En Docker Desktop el tráfico local entra por el proxy de puertos y todas las peticiones parecen
# venir de la misma IP (la del gateway de la red), así que en local el límite es global, no por usuario.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # text/html siempre se comprime; el resto hay que listarlo.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Mismo origen que la SPA: sin CORS. Sin barra final en proxy_pass para conservar el prefijo /api/.
    # ^~: si este prefijo coincide, nginx no evalúa las location con regex (como la de los hash),
    # así que ninguna ruta de la API puede acabar servida como fichero estático.
    location ^~ /api/ {
        # burst absorbe ráfagas cortas (escribir con debounce, recargar, cambiar de unidad) y nodelay
        # las sirve al momento en vez de encolarlas; solo lo que excede la ráfaga recibe 429.
        limit_req zone=api burst=20 nodelay;
        # Por defecto sería 503, que el frontend ya usa para "AEMET limita al backend".
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheros con hash de contenido (main-3WTY3YLK.js, styles-GFKSKNW2.css...): su nombre cambia si cambian.
    location ~* "-[a-z0-9]{8}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html apunta a los hash vigentes: siempre se revalida.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: lo que no es un fichero lo resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
