server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # text/html siempre se comprime; el resto hay que listarlo.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Mismo origen que la SPA: sin CORS. Sin barra final en proxy_pass para conservar el prefijo /api/.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheros con hash de contenido (main-3WTY3YLK.js, styles-GFKSKNW2.css...): su nombre cambia si cambian.
    location ~* "-[a-z0-9]{8}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html apunta a los hash vigentes: siempre se revalida.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: lo que no es un fichero lo resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
